<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Details | BlackApp</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen;
      background: #0a0a0a;
      color: white;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    img {
      max-width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    h1, h2 {
      color: #00ffcc;
    }
    .event-detail {
      margin-bottom: 14px;
    }
    button {
      background-color: #00ffcc;
      color: black;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h1 id="title">Loading...</h1>
  <img id="eventImage" src="" alt="Event Image" style="display:none"/>
  <p class="event-detail" id="description"></p>
  <p class="event-detail"><strong>Location:</strong> <span id="location">Online / N/A</span></p>
  <p class="event-detail"><strong>Date:</strong> <span id="date"></span></p>
  <p class="event-detail"><strong>Tickets:</strong> $<span id="ticketPrice"></span></p>
  <p class="event-detail"><strong>Tables:</strong> $<span id="tablePrice"></span></p>
  <button id="buyButton" style="display:none">Buy Tickets / Tables</button>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBfPFzykzjYq1jq0XSq32angp4-qFrFWFMY",
      authDomain: "blackappios.firebaseapp.com",
      databaseURL: "https://blackappios-default-rtdb.firebaseio.com",
      projectId: "blackappios",
      storageBucket: "blackappios.appspot.com",
      messagingSenderId: "139895432289",
      appId: "1:139895432289:ios:4de4c667ed23e08ac0b620"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const query = new URLSearchParams(window.location.search);
    const eventId = query.get("eventId");

    if (!eventId) {
      document.getElementById("title").textContent = "❌ Event not found.";
    } else {
      db.ref("events/" + eventId).once("value").then((snap) => {
        const event = snap.val();
        if (!event) {
          document.getElementById("title").textContent = "❌ Event not found.";
          return;
        }

        console.log("✅ Event loaded:", event);

        // Set content
        document.getElementById("title").textContent = event.title;
        document.getElementById("description").textContent = event.description;
        document.getElementById("date").textContent = new Date(event.date * 1000).toLocaleString();
        document.getElementById("ticketPrice").textContent = event.ticketPrice?.toFixed(2) || "0.00";
        document.getElementById("tablePrice").textContent = event.tablePrice?.toFixed(2) || "0.00";

        // Load image
        if (event.imagePath) {
          const encodedPath = encodeURIComponent(event.imagePath);
          const imageUrl = `https://firebasestorage.googleapis.com/v0/b/blackappios.appspot.com/o/${encodedPath}?alt=media`;

          document.getElementById("eventImage").src = imageUrl;
          document.getElementById("eventImage").style.display = "block";

          console.log("📷 Image loaded:", imageUrl);
        }

        // Show button
        document.getElementById("buyButton").style.display = "block";

        // Buy button click → redirect to checkout
        document.getElementById("buyButton").addEventListener("click", () => {
          const url = new URL("/index.html", window.location.origin);
          url.searchParams.set("eventId", eventId);
          url.searchParams.set("eventName", event.title);
          url.searchParams.set("ticketQty", 0);
          url.searchParams.set("ticketPrice", event.ticketPrice);
          url.searchParams.set("tableQty", 0);
          url.searchParams.set("tablePrice", event.tablePrice);
          url.searchParams.set("baseTotal", 0);
          url.searchParams.set("totalWithFee", 0);
          url.searchParams.set("payoutMethod", event.payoutMethod || "");
          url.searchParams.set("payoutDetails", event.payoutDetails || "");
          url.searchParams.set("eventImagePath", event.imagePath || "");
          url.searchParams.set("eventTime", event.date);

          window.location.href = url.toString();
        });
      }).catch(error => {
        console.error("❌ Firebase error:", error);
        document.getElementById("title").textContent = "❌ Error loading event.";
      });
    }
  </script>
</body>
</html>
