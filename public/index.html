<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlackApp Checkout</title>
  <script src="https://js.braintreegateway.com/web/dropin/1.42.0/js/dropin.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen;
      background: #0a0a0a;
      color: white;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }
    h1, h2 { color: #00ffcc; }
    .summary { margin-bottom: 20px; }
    #dropin-container { margin-top: 20px; }
    button {
      background-color: #00ffcc;
      color: black;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Confirm Your Order</h1>

  <div class="summary">
    <p><strong>Event:</strong> <span id="eventName"></span></p>
    <p><strong>Tickets:</strong> <span id="ticketSummary"></span></p>
    <p><strong>Tables:</strong> <span id="tableSummary"></span></p>
    <p><strong>Subtotal:</strong> $<span id="baseTotal"></span></p>
    <p><strong>Platform Fee (2%):</strong> $<span id="fee"></span></p>
    <p><strong>Total to Pay:</strong> $<span id="total"></span></p>
  </div>

  <!-- Only Braintree Drop-in (cards + PayPal) -->
  <div id="dropin-container"></div>
  <button id="submit-button" style="display:none">Pay Now</button>

  <script>
    // --------------------------
    // Parse query params
    // --------------------------
    const query = new URLSearchParams(window.location.search);
    const userId = query.get("userId") || "unknown";
    const eventId = query.get("eventId") || "unknown";
    const eventName = decodeURIComponent(query.get("eventName") || "Event");
    const eventImagePath = decodeURIComponent(query.get("eventImagePath") || "");
    const eventTime = query.get("eventTime") || "";
    const ticketQty = Number(query.get("ticketQty") || 0);
    const ticketPrice = Number(query.get("ticketPrice") || 0);
    const tableQty = Number(query.get("tableQty") || 0);
    const tablePrice = Number(query.get("tablePrice") || 0);
    const baseTotal = parseFloat(query.get("baseTotal") || "0");
    const totalWithFee = parseFloat(query.get("totalWithFee") || "0");

    // These may still be present from event settings; harmless to forward to backend
    const payoutMethod = query.get("payoutMethod") || "PayPal";
    const payoutDetails = decodeURIComponent(query.get("payoutDetails") || "");

    // --------------------------
    // Fill UI
    // --------------------------
    document.getElementById("eventName").textContent = eventName;
    document.getElementById("ticketSummary").textContent =
      `${ticketQty} x $${ticketPrice} = $${(ticketQty * ticketPrice).toFixed(2)}`;
    document.getElementById("tableSummary").textContent =
      `${tableQty} x $${tablePrice} = $${(tableQty * tablePrice).toFixed(2)}`;
    document.getElementById("baseTotal").textContent = baseTotal.toFixed(2);
    document.getElementById("fee").textContent = (totalWithFee - baseTotal).toFixed(2);
    document.getElementById("total").textContent = totalWithFee.toFixed(2);

    // --------------------------
    // Braintree Drop-in (Cards + PayPal)
    // --------------------------
    const submitBtn = document.getElementById("submit-button");

    fetch("https://us-central1-blackappios.cloudfunctions.net/generateClientToken")
      .then(res => res.json())
      .then(data => {
        console.log("🔑 Received Braintree client token");
        const amountToSend = parseFloat(totalWithFee) || 0.01;

        braintree.dropin.create({
          authorization: data.clientToken,
          container: "#dropin-container",
          // Let Drop-in show Card and PayPal options automatically
          paypal: {
            flow: "checkout",
            amount: amountToSend,
            currency: "USD"
          },
          card: {
            cardholderName: { required: true },
            overrides: {
              fields: {
                postalCode: { placeholder: "12345" },
                cvv: { placeholder: "123" }
              }
            }
          }
        }, (err, dropinInstance) => {
          if (err) {
            console.error("❌ Braintree Init Error:", err);
            alert("Could not initialize payment system.");
            return;
          }

          console.log("✅ Braintree Drop-in Ready");
          submitBtn.disabled = false;
          submitBtn.style.display = "inline-block";

          submitBtn.addEventListener("click", () => {
            dropinInstance.requestPaymentMethod((err, payload) => {
              if (err) {
                console.error("❌ Payment Method Error:", err);
                alert("Please select a payment method.");
                return;
              }

              const postData = {
                amount: amountToSend.toFixed(2),
                paymentMethodNonce: payload.nonce,
                userId, eventId, eventName, eventImagePath, eventTime,
                ticketQty, ticketPrice, tableQty, tablePrice,
                baseTotal, totalWithFee,
                payoutMethod, payoutDetails, // forwarded for your records
                platformFee: (totalWithFee - baseTotal)
              };

              console.log("📤 Submitting payment:", postData);

              fetch("https://us-central1-blackappios.cloudfunctions.net/createTransaction", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(postData)
              })
              .then(res => res.json())
              .then(result => {
                console.log("📦 Transaction result:", result);
                if (result.success) {
                  alert("✅ Payment successful!");
                  window.location.href = "blackappios://payment-success";
                } else {
                  alert("❌ Payment failed: " + (result.error || "Unknown error"));
                }
              })
              .catch(err => {
                console.error("❌ Payment request failed:", err);
                alert("Failed to complete payment.");
              });
            });
          });
        });
      })
      .catch(err => {
        console.error("❌ Failed to fetch Braintree token:", err);
        alert("Could not initialize payment system.");
      });
  </script>
</body>
</html>
